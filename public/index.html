/* ── Setup action functions — always global, always available ── */
async function suVerify() {
  const inp    = document.getElementById('su-key');
  const status = document.getElementById('su-status');
  const verBtn = document.getElementById('su-verify');
  const savBtn = document.getElementById('su-save');
  if (!inp) return;
  const key = inp.value.trim();
  if (!key) {
    if (status) status.innerHTML = '<span style="color:#f87171">❌ Cole a chave antes de verificar</span>';
    return;
  }
  if (verBtn) { verBtn.textContent = '⏳...'; verBtn.disabled = true; }
  if (status) status.innerHTML = '<span style="color:#64748b">📡 A verificar com TomTom...</span>';
  try {
    const ctrl = new AbortController();
    const tid  = setTimeout(() => ctrl.abort(), 12000);
    const r    = await fetch(
      'https://api.tomtom.com/routing/1/calculateRoute/38.72,-9.14:38.71,-9.13/json?key=' + key + '&travelMode=car&traffic=true',
      { signal: ctrl.signal }
    );
    clearTimeout(tid);
    const d = await r.json();
    if (r.ok && d.routes && d.routes.length > 0) {
      if (status) status.innerHTML = '<span style="color:#34d399">✅ Chave válida! TomTom com trânsito ativo 🚦</span>';
      S._pendingSetupKey = key;
      if (savBtn) {
        savBtn.style.opacity = '1';
        savBtn.style.cursor  = 'pointer';
        savBtn.style.pointerEvents = 'auto';
      }
    } else if (r.status === 403) {
      if (status) status.innerHTML = '<span style="color:#f87171">❌ Chave inválida (403) — verifique no dashboard TomTom</span>';
    } else {
      const msg = (d.detailedError && d.detailedError.message) || ('HTTP ' + r.status);
      if (status) status.innerHTML = '<span style="color:#f87171">❌ ' + msg + '</span>';
    }
  } catch(err) {
    const msg = err.name === 'AbortError' ? 'Timeout (12s) — verifique a internet' : err.message;
    if (status) status.innerHTML = '<span style="color:#f87171">❌ ' + msg + '</span>';
  } finally {
    if (verBtn) { verBtn.textContent = '🔑 Verificar'; verBtn.disabled = false; }
  }
}

async function suSave() {
  const key = S._pendingSetupKey || (document.getElementById('su-key')?.value || '').trim();
  if (!key) return;
  const btn = document.getElementById('su-save');
  if (btn) { btn.textContent = '⏳ A salvar...'; btn.disabled = true; }
  try {
    await API.post('/api/config', { tomtom_key: key, setup_complete: '1' });
    S.routeConfig.trafficKey = key;
    delete S._pendingSetupKey;
    toast('✅ Chave TomTom salva!');
  } catch(err) {
    toast('Erro ao salvar: ' + err.message, 'error');
    if (btn) { btn.textContent = '✅ Salvar e Continuar'; btn.disabled = false; }
    return;
  }
  // Restore layout
  const sidebar = document.getElementById('sidebar');
  const topbar  = document.getElementById('topbar');
  const pc      = document.getElementById('page-content');

async function settingsTestKey() {
  const key = document.getElementById('settings-key')?.value?.trim();
  const status = document.getElementById('settings-key-status');
  const btn = document.getElementById('settings-test-btn');
  const saveBtn = document.getElementById('settings-save-btn');
  if (!key) { if(status) status.innerHTML='<span style="color:var(--red2)">❌ Cole a chave</span>'; return; }
  if (btn) btn.innerHTML = '⏳...';
  if (status) status.innerHTML = '<span style="color:var(--text3)">📡 Testando...</span>';
  try {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 12000);
    const r = await fetch(
      `https://api.tomtom.com/routing/1/calculateRoute/-23.55,-46.63:-23.56,-46.64/json?key=${key}&travelMode=car&traffic=true`,
      { signal: ctrl.signal }
    );
    const d = await r.json();
    if (r.ok && d.routes?.length) {
      if (status) status.innerHTML = '<span style="color:var(--green2)">✅ Chave válida!</span>';
      S._pendingSettingsKey = key;
      if (saveBtn) { saveBtn.disabled=false; saveBtn.style.opacity='1'; saveBtn.style.cursor='pointer'; }
    } else {
      if (status) status.innerHTML = `<span style="color:var(--red2)">❌ HTTP ${r.status}</span>`;
    }
  } catch(e) {
    if (status) status.innerHTML = `<span style="color:var(--red2)">❌ ${e.name==='AbortError'?'Timeout':e.message}</span>`;
  } finally { if (btn) btn.innerHTML = '🔑 Testar'; }
}

async function settingsSaveKey() {
  const key = S._pendingSettingsKey;
  if (!key) return;
  try {
    await API.post('/api/config', { tomtom_key: key, setup_complete: '1' });
    S.routeConfig.trafficKey = key;
    delete S._pendingSettingsKey;
    const warn = document.getElementById('settings-warn');
    if (warn) warn.style.display = 'none';
    toast('✅ Chave salva! TomTom com trânsito ativado.');
    renderSettings();
  } catch(e) { toast('Erro: ' + e.message, 'error'); }
}

async function removeKey() {
  try {
    await API.del('/api/config/tomtom_key');
    S.routeConfig.trafficKey = '';
    const warn = document.getElementById('settings-warn');
    if (warn) warn.style.display = 'block';
    toast('Chave TomTom removida — usando OSRM', 'info');
    renderSettings();
  } catch(e) { toast('Erro: ' + e.message, 'error'); }
}

/* ══════════════════════════════════════════════════════
   NAVEGAÇÃO IN-APP — Rota pelas ruas + GPS tracking
   Usa OSRM steps para instruções turn-by-turn
   Leaflet full-screen com posição em tempo real
══════════════════════════════════════════════════════ */
const NavMode = {
  active:      false,
  stopIdx:     0,
  watchId:     null,
  steps:       [],   // OSRM turn-by-turn steps para o trecho atual
  curStepIdx:  0,
  navMap:      null,
  posMarker:   null,
  routeLayer:  null,

  async start(fromStopIdx) {
    this.stopIdx    = fromStopIdx;
    this.active     = true;
    this.steps      = [];
    this.curStepIdx = 0;

    // Criar overlay de navegação full-screen
    const existing = document.getElementById('nav-overlay');
    if (existing) existing.remove();

    const ov = document.createElement('div');
    ov.id = 'nav-overlay';
    ov.style.cssText = 'position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);';
    ov.innerHTML =
      // ── Top instruction bar ──
      '<div id="nav-top" style="background:#1a2744;padding:14px 18px;flex-shrink:0;display:flex;gap:14px;align-items:flex-start">' +
        '<div id="nav-maneuver" style="width:52px;height:52px;border-radius:12px;background:var(--blue);' +
          'display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0">▲</div>' +
        '<div>' +
          '<div id="nav-instruction" style="font-size:17px;font-weight:700;color:white">Calculando rota...</div>' +
          '<div id="nav-road" style="font-size:13px;color:#8ba3c1;margin-top:3px"></div>' +
        '</div>' +
        '<div style="margin-left:auto;text-align:right;flex-shrink:0">' +
          '<div id="nav-dist-next" style="font-size:22px;font-weight:800;color:white"></div>' +
          '<div id="nav-unit-next" style="font-size:12px;color:#8ba3c1">próx. curva</div>' +
        '</div>' +
      '</div>' +

      // ── Map ──
      '<div id="nav-map" style="flex:1;min-height:0;background:#0a1220"></div>' +

      // ── Bottom bar ──
      '<div id="nav-bottom" style="background:#0d1829;border-top:1px solid #1e3454;padding:14px 18px;flex-shrink:0">' +
        '<div style="display:flex;align-items:center;gap:14px;margin-bottom:12px">' +
          '<div style="flex:1">' +
            '<div id="nav-stop-label" style="font-size:15px;font-weight:700;color:white">Calculando...</div>' +
            '<div style="display:flex;gap:12px;margin-top:4px">' +
              '<span id="nav-stop-pos" style="font-size:12px;color:#8ba3c1"></span>' +
              '<span id="nav-eta" style="font-size:12px;color:#8ba3c1"></span>' +
              '<span id="nav-dist" style="font-size:12px;color:#8ba3c1"></span>' +
            '</div>' +
          '</div>' +
          '<div style="text-align:right;flex-shrink:0">' +
            '<div id="nav-total-time" style="font-size:22px;font-weight:800;color:var(--green2)"></div>' +
            '<div style="font-size:11px;color:#8ba3c1">tempo total</div>' +
          '</div>' +
        '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">' +
          '<button class="btn" style="background:rgba(239,68,68,.15);color:var(--red2);border:1px solid rgba(239,68,68,.3);' +
            'justify-content:center;padding:13px;font-size:14px;font-weight:700" ' +
            'onclick="NavMode.markCurrent(\'failed\')">📦✗ Não entregue</button>' +
          '<button class="btn" style="background:rgba(16,185,129,.15);color:var(--green2);border:1px solid rgba(16,185,129,.3);' +
            'justify-content:center;padding:13px;font-size:14px;font-weight:700" ' +
            'onclick="NavMode.markCurrent(\'done\')">📦✓ Entregue</button>' +
        '</div>' +
        '<div style="display:flex;gap:8px">' +
          '<button class="btn btn-ghost btn-sm" style="flex:1;justify-content:center" onclick="NavMode.prevStop()">← Anterior</button>' +
          '<button class="btn btn-ghost btn-sm" style="flex:1;justify-content:center" onclick="NavMode.stop()">⏹ Encerrar</button>' +
          '<button class="btn btn-ghost btn-sm" style="flex:1;justify-content:center" onclick="NavMode.nextStop()">Próxima →</button>' +
        '</div>' +
      '</div>';

    document.body.appendChild(ov);

    // Init navigation map
    const sLat = +S.routeConfig.startLat, sLon = +S.routeConfig.startLon;
    const dest  = S.generatedRoute[fromStopIdx];
    const m = L.map('nav-map', { zoomControl: false, attributionControl: false })
               .setView([dest?.lat || sLat, dest?.lon || sLon], 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
      { maxZoom: 19 }).addTo(m);
    this.navMap = m;

    // Draw full route
    if (S.routeGeometry?.coordinates?.length) {
      const lls = S.routeGeometry.coordinates.map(c => [c[1], c[0]]);
      this.routeLayer = L.polyline(lls, { color:'#60a5fa', weight:5, opacity:.7 }).addTo(m);
    }

    // Plot all remaining stops
    S.generatedRoute.forEach((s, i) => {
      if (i < fromStopIdx) return;
      const st = (S.stopStatus||{})[i];
      const color = st==='done'?'#34d399':st==='failed'?'#f87171':i===fromStopIdx?'#3b82f6':'#1e3454';
      L.circleMarker([s.lat,s.lon],{radius:8,color:color,fillColor:color,fillOpacity:1,weight:2}).addTo(m);
    });

    // Start GPS tracking
    await this._loadSteps();
    this._startGPS();
    this._updateUI();
  },

  async _loadSteps() {
    // Get OSRM steps for current stop
    const route  = S.generatedRoute;
    const cur    = route[this.stopIdx];
    if (!cur) return;
    const prevLat = this.stopIdx === 0 ? +S.routeConfig.startLat : route[this.stopIdx-1].lat;
    const prevLon = this.stopIdx === 0 ? +S.routeConfig.startLon : route[this.stopIdx-1].lon;
    const gpsLat  = S._navLat || prevLat;
    const gpsLon  = S._navLon || prevLon;

    try {
      const url = 'https://router.project-osrm.org/route/v1/driving/'
        + gpsLon + ',' + gpsLat + ';' + cur.lon + ',' + cur.lat
        + '?steps=true&geometries=geojson&overview=full';
      const r = await OSRM._fetch(url);
      if (r.routes?.[0]) {
        this.steps = r.routes[0].legs[0].steps || [];
        this.curStepIdx = 0;

        // Draw segment polyline
        if (this.navMap && this.routeLayer) this.navMap.removeLayer(this.routeLayer);
        const coords = r.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
        this.routeLayer = L.polyline(coords, { color:'#3b82f6', weight:6, opacity:.9 }).addTo(this.navMap);
        if (coords.length) this.navMap.fitBounds(this.routeLayer.getBounds(), { padding:[60,60] });
      }
    } catch(e) {
      console.warn('[Nav] Steps load failed:', e.message);
    }
    this._updateInstruction();
  },

  _startGPS() {
    if (this.watchId) navigator.geolocation.clearWatch(this.watchId);
    if (!navigator.geolocation) { this._updateInstruction(); return; }
    this.watchId = navigator.geolocation.watchPosition(
      pos => {
        const la = pos.coords.latitude, lo = pos.coords.longitude;
        S._navLat = la; S._navLon = lo;
        // Update position marker
        if (this.navMap) {
          if (this.posMarker) this.navMap.removeLayer(this.posMarker);
          this.posMarker = L.circleMarker([la,lo],{
            radius:10, color:'white', fillColor:'#3b82f6', fillOpacity:1, weight:3
          }).addTo(this.navMap);
          // Center map on position
          this.navMap.panTo([la,lo], { animate: true, duration: 0.5 });
        }
        // Find next step
        this._advanceSteps(la, lo);
      },
      err => console.warn('[Nav GPS]', err.message),
      { enableHighAccuracy: true, maximumAge: 3000 }
    );
  },

  _advanceSteps(la, lo) {
    if (!this.steps.length) return;
    const step = this.steps[this.curStepIdx];
    if (!step) return;
    // Check if close to step intersection
    const stepEnd = step.maneuver?.location;
    if (stepEnd) {
      const dist = Engine.haversine(la, lo, stepEnd[1], stepEnd[0]) * 1000;
      if (dist < 30 && this.curStepIdx < this.steps.length - 1) {
        this.curStepIdx++;
        this._updateInstruction();
      }
    }
    // Check if arrived at stop
    const dest = S.generatedRoute[this.stopIdx];
    if (dest) {
      const distToDest = Engine.haversine(la, lo, dest.lat, dest.lon) * 1000;
      if (distToDest < 50) {
        // Arrived! Show alert
        const label = document.getElementById('nav-stop-label');
        if (label) label.style.color = 'var(--green2)';
        const top = document.getElementById('nav-instruction');
        if (top) top.textContent = '🎯 Você chegou!';
      }
    }
  },

  _updateInstruction() {
    const step = this.steps[this.curStepIdx];
    if (!step) { this._showDefaultInstruction(); return; }

    const icons = {
      turn: { left: '↰', right: '↱', 'sharp left': '↰', 'sharp right': '↱', straight: '↑', uturn: '↺' },
      arrive: '🎯', depart: '▲', roundabout: '⟳', merge: '↗', fork: '↗',
    };
    const type    = step.maneuver?.type || 'continue';
    const mod     = step.maneuver?.modifier || '';
    let icon      = type === 'turn' ? (icons.turn[mod] || '↑') : (icons[type] || '↑');
    const dist    = step.distance || 0;
    const distStr = dist > 1000 ? (dist/1000).toFixed(1) + ' km' : Math.round(dist) + ' m';

    const instr    = document.getElementById('nav-instruction');
    const road     = document.getElementById('nav-road');
    const maneuver = document.getElementById('nav-maneuver');
    const distNext = document.getElementById('nav-dist-next');
    const unitNext = document.getElementById('nav-unit-next');

    if (instr) instr.textContent = this._instructionText(type, mod, step.name);
    if (road)  road.textContent  = step.name || '';
    if (maneuver) maneuver.textContent = icon;
    if (distNext) distNext.textContent = dist > 1000 ? (dist/1000).toFixed(1) : Math.round(dist);
    if (unitNext) unitNext.textContent = dist > 1000 ? 'km · próx. curva' : 'm · próx. curva';
  },

  _showDefaultInstruction() {
    const dest = S.generatedRoute[this.stopIdx];
    const instr = document.getElementById('nav-instruction');
    if (instr) instr.textContent = dest ? 'Em direção a ' + (dest.address||dest.id||'') : 'Siga em frente';
    const maneuver = document.getElementById('nav-maneuver');
    if (maneuver) maneuver.textContent = '▲';
  },

  _instructionText(type, mod, name) {
    const street = name ? ' em ' + name : '';
    const modPT  = { left:'à esquerda', right:'à direita', straight:'em frente',
                     'sharp left':'bem à esquerda', 'sharp right':'bem à direita', uturn:'retorne' };
    if (type==='turn') return 'Vire ' + (modPT[mod]||mod) + street;
    if (type==='arrive') return '🎯 Você chegou!';
    if (type==='depart') return 'Siga' + street;
    if (type==='roundabout') return 'Entre na rotatória' + street;
    if (type==='merge') return 'Incorpore' + street;
    return 'Continue' + street;
  },

  _updateUI() {
    const route   = S.generatedRoute;
    const cur     = route[this.stopIdx];
    if (!cur) return;

    const pos   = document.getElementById('nav-stop-pos');
    const label = document.getElementById('nav-stop-label');
    const eta   = document.getElementById('nav-eta');
    const dist  = document.getElementById('nav-dist');
    const total = document.getElementById('nav-total-time');

    const remaining = route.slice(this.stopIdx).filter((_,i) => (S.stopStatus||{})[this.stopIdx+i] !== 'done');
    const remTime   = remaining.reduce((s,r)=>s+(r.timeSec||180),0);
    const etaTime   = new Date(Date.now() + remTime*1000).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

    if (label) label.textContent  = cur.address || cur.id || '';
    if (pos)   pos.textContent    = (this.stopIdx+1) + '/' + route.length;
    if (eta)   eta.textContent    = '🕐 ' + etaTime;
    if (dist)  dist.textContent   = (cur.distFromPrev||0).toFixed(1) + ' km';
    if (total) total.textContent  = Math.floor(remTime/3600)+'h'+Math.round((remTime%3600)/60)+'m';
  },

  markCurrent(status) {
    if (!S.stopStatus) S.stopStatus = {};
    S.stopStatus[this.stopIdx] = status;
    toast(status==='done' ? '✅ Entregue!' : '❌ Não entregue', status==='done'?'success':'error');
    this.nextStop();
  },

  nextStop() {
    const route = S.generatedRoute;
    let next = this.stopIdx + 1;
    // Skip already completed stops
    while (next < route.length && (S.stopStatus||{})[next] === 'done') next++;
    if (next >= route.length) {
      toast('🏁 Última entrega concluída!', 'success');
      this.stop();
      return;
    }
    this.stopIdx = next;
    this._loadSteps();
    this._updateUI();
    document.getElementById('stop-action-drawer')?.remove();
  },

  prevStop() {
    if (this.stopIdx > 0) {
      this.stopIdx--;
      this._loadSteps();
      this._updateUI();
    }
  },

  stop() {
    if (this.watchId) { navigator.geolocation.clearWatch(this.watchId); this.watchId = null; }
    if (this.navMap)  { this.navMap.remove(); this.navMap = null; }
    this.active = false;
    document.getElementById('nav-overlay')?.remove();
    // Return to route view
    renderStep4(document.getElementById('step-content'));
    document.getElementById('stop-action-drawer')?.remove();
  },
};

function startInAppNav(idx) {
  document.getElementById('stop-action-drawer')?.remove();
  NavMode.start(idx || 0);
}

  } catch(e) {
    // Se servidor não responder, mostra tela de setup offline
    console.warn('[Init] Servidor indisponível:', e.message);
    document.getElementById('page-content').innerHTML = `
      <div class="empty-state" style="margin-top:80px">
        <div class="empty-icon">🔌</div>
        <div class="empty-title">Servidor não encontrado</div>
        <div class="empty-sub" style="max-width:400px;margin:0 auto">
          Execute <code style="background:var(--surf2);padding:2px 8px;border-radius:4px;color:var(--amber)">npm start</code>
          na pasta do projeto e recarregue a página.
        </div>
        <button class="btn btn-primary mt-24" onclick="location.reload()">🔄 Tentar novamente</button>
      </div>`;
  }
});
</script>
</body>
</html>
