<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RoteiroPro" />
  <meta name="theme-color" content="#060b18" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <title>RoteiroPro</title>

  <!-- CDN Dependencies -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />

  <style>
    /* ════════════════════════════════════════
       DESIGN TOKENS
    ════════════════════════════════════════ */
    :root {
      --bg:       #060b18;
      --surf0:    #09111f;
      --surf1:    #0d1829;
      --surf2:    #111f35;
      --border:   #182a45;
      --border2:  #1e3454;
      --text:     #e2e8f0;
      --text2:    #8ba3c1;
      --text3:    #3d5a7a;
      --blue:     #3b82f6;
      --blue2:    #60a5fa;
      --amber:    #f59e0b;
      --green:    #10b981;
      --green2:   #34d399;
      --red:      #ef4444;
      --red2:     #f87171;
      --purple:   #8b5cf6;
      --purple2:  #a78bfa;
      /* Mobile-first layout variables */
      --sidebar:  0px;
      --topbar:   52px;
      --bottomnav: 64px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --radius:   12px;
      --shadow:   0 4px 24px rgba(0,0,0,.45);
    }
    /* Desktop: restore sidebar */
    @media (min-width: 768px) {
      :root {
        --sidebar:  220px;
        --topbar:   56px;
        --bottomnav: 0px;
      }
    }

    /* ════════════════════════════════════════
       RESET & BASE
    ════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Lexend', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; font-family: inherit; }
    input, textarea, select { font-family: inherit; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--surf0); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #2a4a6a; }

    /* ════════════════════════════════════════
       LAYOUT
    ════════════════════════════════════════ */
    #app { display: flex; height: 100vh; }

    /* ── SIDEBAR ── */
    #sidebar {
      width: var(--sidebar);
      height: 100vh;
      background: var(--surf0);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 10;
    }
    .sb-logo {
      height: var(--topbar);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
    }
    .sb-logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .sb-logo-text { font-size: 17px; font-weight: 800; letter-spacing: -.3px; }
    .sb-logo-text span { color: var(--blue2); }
    .sb-logo-badge {
      margin-left: auto;
      font-size: 9px; font-weight: 700;
      background: var(--amber); color: #000;
      border-radius: 4px; padding: 2px 5px;
      letter-spacing: .5px;
    }

    .sb-nav { flex: 1; padding: 12px 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .sb-section { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: 1.2px; text-transform: uppercase; padding: 12px 10px 6px; }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: 8px;
      color: var(--text2); font-size: 13px; font-weight: 500;
      transition: all .15s; border: none; background: none;
      width: 100%; text-align: left; cursor: pointer;
    }
    .nav-item:hover { background: var(--surf1); color: var(--text); }
    .nav-item.active { background: rgba(59,130,246,.15); color: var(--blue2); }
    .nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
    .nav-item .nav-badge {
      margin-left: auto; background: var(--blue); color: #fff;
      font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px;
    }

    .sb-footer {
      border-top: 1px solid var(--border);
      padding: 14px;
    }
    .sb-org {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 8px; border-radius: 8px;
      transition: background .15s; cursor: pointer;
    }
    .sb-org:hover { background: var(--surf1); }
    .sb-org-avatar {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; color: white; flex-shrink: 0;
    }
    .sb-org-name { font-size: 13px; font-weight: 600; line-height: 1.2; }
    .sb-org-plan { font-size: 11px; color: var(--green2); }

    /* ── MAIN ── */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

    #topbar {
      height: var(--topbar);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 28px; gap: 16px;
      background: var(--surf0);
      flex-shrink: 0;
    }
    #page-title { font-size: 16px; font-weight: 700; flex: 1; }
    #page-subtitle { font-size: 12px; color: var(--text3); }
    .topbar-actions { display: flex; gap: 8px; align-items: center; }

    #page-content {
      flex: 1; overflow-y: auto;
      padding: 28px;
    }

    /* ════════════════════════════════════════
       COMMON COMPONENTS
    ════════════════════════════════════════ */

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 16px; border-radius: 8px; border: none;
      font-size: 13px; font-weight: 600; transition: all .15s;
      white-space: nowrap; cursor: pointer;
      touch-action: manipulation;  /* prevents double-tap zoom without breaking clicks */
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .nav-item { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .config-row { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .circuit-stop { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .btn-primary { background: var(--blue); color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-ghost { background: var(--surf2); color: var(--text2); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--border2); }
    .btn-amber { background: var(--amber); color: #000; font-weight: 700; }
    .btn-amber:hover { background: #d97706; }
    .btn-danger { background: rgba(239,68,68,.15); color: var(--red2); border: 1px solid rgba(239,68,68,.3); }
    .btn-danger:hover { background: rgba(239,68,68,.25); }
    .btn-success { background: rgba(16,185,129,.15); color: var(--green2); border: 1px solid rgba(16,185,129,.3); }
    .btn-success:hover { background: rgba(16,185,129,.25); }
    .btn-sm { padding: 5px 11px; font-size: 12px; }
    .btn-lg { padding: 12px 24px; font-size: 15px; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    /* Badges */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600;
    }
    .badge-blue   { background: rgba(59,130,246,.15); color: var(--blue2); border: 1px solid rgba(59,130,246,.3); }
    .badge-green  { background: rgba(16,185,129,.15); color: var(--green2); border: 1px solid rgba(16,185,129,.3); }
    .badge-amber  { background: rgba(245,158,11,.15); color: var(--amber); border: 1px solid rgba(245,158,11,.3); }
    .badge-red    { background: rgba(239,68,68,.12); color: var(--red2); border: 1px solid rgba(239,68,68,.3); }
    .badge-purple { background: rgba(139,92,246,.15); color: var(--purple2); border: 1px solid rgba(139,92,246,.3); }
    .badge-gray   { background: var(--surf2); color: var(--text2); border: 1px solid var(--border); }

    /* Cards */
    .card {
      background: var(--surf1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px;
    }
    .card-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .card-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }

    /* KPI Cards */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .kpi-card {
      background: var(--surf1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      position: relative; overflow: hidden;
    }
    .kpi-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--kpi-color, var(--blue)), transparent);
    }
    .kpi-icon { font-size: 20px; margin-bottom: 10px; }
    .kpi-value { font-size: 28px; font-weight: 800; color: var(--kpi-color, var(--blue)); font-family: 'JetBrains Mono', monospace; line-height: 1; }
    .kpi-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .8px; margin-top: 6px; }
    .kpi-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }

    /* Tables */
    .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead tr { background: var(--surf0); }
    th { padding: 10px 14px; text-align: left; color: var(--text3); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; white-space: nowrap; border-bottom: 1px solid var(--border); }
    td { padding: 11px 14px; border-bottom: 1px solid rgba(24,42,69,.5); color: var(--text2); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .1s; }
    tbody tr:hover { background: rgba(255,255,255,.02); }
    .td-mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
    .td-bold { color: var(--text); font-weight: 600; }

    /* Form elements */
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 7px; text-transform: uppercase; letter-spacing: .6px; }
    .form-input {
      width: 100%; background: var(--surf0); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text);
      padding: 10px 14px; font-size: 13px; outline: none;
      transition: border-color .15s;
      font-family: 'JetBrains Mono', monospace;
    }
    .form-input:focus { border-color: var(--blue2); }
    .form-input::placeholder { color: var(--text3); }
    .form-row { display: flex; gap: 14px; }
    .form-row .form-group { flex: 1; }

    /* Page sections */
    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-size: 22px; font-weight: 800; letter-spacing: -.3px; }
    .page-header p { color: var(--text3); font-size: 13px; margin-top: 4px; }

    /* Dividers */
    .divider { height: 1px; background: var(--border); margin: 20px 0; }

    /* ════════════════════════════════════════
       DASHBOARD
    ════════════════════════════════════════ */
    .charts-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; margin-bottom: 24px; }
    @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }

    /* ════════════════════════════════════════
       NOVA ROTA — STEPPER
    ════════════════════════════════════════ */
    .stepper {
      display: flex; align-items: center; gap: 0;
      margin-bottom: 28px;
    }
    .step-item {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 500; color: var(--text3);
    }
    .step-item.active { color: var(--blue2); }
    .step-item.done { color: var(--green2); }
    .step-num {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--surf2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; color: var(--text3);
    }
    .step-item.active .step-num { background: var(--blue); border-color: var(--blue); color: #fff; }
    .step-item.done .step-num { background: var(--green); border-color: var(--green); color: #fff; }
    .step-connector { flex: 1; height: 1px; background: var(--border); margin: 0 8px; max-width: 60px; }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed var(--border2);
      border-radius: 14px; padding: 48px 32px;
      text-align: center; cursor: pointer;
      transition: all .2s; background: var(--surf0);
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--blue2);
      background: rgba(59,130,246,.04);
    }
    .upload-icon { font-size: 48px; margin-bottom: 14px; }
    .upload-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .upload-sub { color: var(--text3); font-size: 13px; }

    /* Mode cards */
    .mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .mode-card {
      padding: 18px; border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--surf0);
      cursor: pointer; transition: all .2s;
      text-align: left;
    }
    .mode-card:hover { border-color: var(--border2); background: var(--surf1); }
    .mode-card.selected { border-color: var(--mode-color); background: rgba(0,0,0,.1); }
    .mode-icon { font-size: 28px; margin-bottom: 10px; }
    .mode-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .mode-desc { font-size: 12px; color: var(--text3); }
    .mode-formula { font-size: 10px; font-family: 'JetBrains Mono', monospace; margin-top: 8px; }

    /* Route result */
    #route-map { width: 100%; height: 420px; border-radius: 10px; overflow: hidden; background: var(--surf0); border: 1px solid var(--border); }

    /* Stops list */
    .stops-list { max-height: 360px; overflow-y: auto; border-radius: 8px; border: 1px solid var(--border); }
    .stop-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 11px 14px; border-bottom: 1px solid rgba(24,42,69,.4);
      cursor: pointer; transition: background .1s;
    }
    .stop-item:last-child { border-bottom: none; }
    .stop-item:hover { background: rgba(255,255,255,.02); }
    .stop-item.expanded { background: rgba(59,130,246,.04); }
    .stop-num {
      width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; margin-top: 1px;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 800; color: white;
    }
    .stop-num.first { background: var(--red2); }
    .stop-num.normal { background: var(--blue); }
    .stop-info { flex: 1; min-width: 0; }
    .stop-label { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stop-addr { font-size: 12px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stop-details { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); display: none; }
    .stop-item.expanded .stop-details { display: block; }
    .stop-detail-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11px; color: var(--text3); }
    .stop-dist { font-size: 11px; color: var(--text3); white-space: nowrap; font-family: 'JetBrains Mono', monospace; }

    /* First stop card */
    .first-stop-card {
      background: var(--surf1); border: 1px solid rgba(248,113,113,.3);
      border-radius: 12px; padding: 18px; position: relative; overflow: hidden;
    }
    .first-stop-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--red2), transparent);
    }

    /* ════════════════════════════════════════
       TOASTS
    ════════════════════════════════════════ */
    #toasts {
      position: fixed; bottom: 24px; right: 24px;
      display: flex; flex-direction: column; gap: 8px;
      z-index: 9999; pointer-events: none;
    }
    .toast {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 18px; border-radius: 10px;
      font-size: 13px; font-weight: 500;
      backdrop-filter: blur(12px);
      animation: slideIn .25s ease-out;
      border: 1px solid transparent;
      box-shadow: var(--shadow);
      pointer-events: auto;
    }
    .toast-success { background: rgba(16,185,129,.9); color: #fff; border-color: rgba(16,185,129,.5); }
    .toast-error   { background: rgba(239,68,68,.9); color: #fff; border-color: rgba(239,68,68,.5); }
    .toast-info    { background: rgba(59,130,246,.9); color: #fff; border-color: rgba(59,130,246,.5); }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ════════════════════════════════════════
       MODAL
    ════════════════════════════════════════ */
    #modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px); z-index: 1000;
      display: none; align-items: center; justify-content: center;
    }
    #modal-overlay.open { display: flex; }
    #modal-box {
      background: var(--surf1); border: 1px solid var(--border);
      border-radius: 14px; padding: 28px;
      max-width: 480px; width: 90%; box-shadow: var(--shadow);
    }
    #modal-title { font-size: 18px; font-weight: 800; margin-bottom: 10px; }
    #modal-body { color: var(--text2); font-size: 14px; margin-bottom: 22px; line-height: 1.6; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

    /* ════════════════════════════════════════
       EMPTY STATES
    ════════════════════════════════════════ */
    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--text3);
    }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-title { font-size: 18px; font-weight: 700; color: var(--text2); margin-bottom: 8px; }
    .empty-sub { font-size: 14px; margin-bottom: 24px; }

    /* ════════════════════════════════════════
       LOADER
    ════════════════════════════════════════ */
    .loader {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; padding: 40px; color: var(--text3); font-size: 14px;
    }
    .spin {
      width: 24px; height: 24px;
      border: 3px solid var(--border2);
      border-top-color: var(--blue2);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    /* ════════════════════════════════════════
       SEARCH BAR
    ════════════════════════════════════════ */
    .search-bar {
      display: flex; align-items: center; gap: 10px;
      background: var(--surf0); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 14px;
      font-size: 13px; color: var(--text2); flex: 1; max-width: 300px;
    }
    .search-bar input {
      background: none; border: none; outline: none;
      color: var(--text); font-size: 13px; width: 100%;
    }
    .search-bar input::placeholder { color: var(--text3); }

    /* ════════════════════════════════════════
       STATUS INDICATOR
    ════════════════════════════════════════ */
    .status-dot {
      display: inline-block; width: 7px; height: 7px;
      border-radius: 50%; margin-right: 5px;
    }
    .status-ativa     .status-dot { background: var(--green2); box-shadow: 0 0 6px var(--green2); }
    .status-concluida .status-dot { background: var(--blue2); }
    .status-cancelada .status-dot { background: var(--text3); }

    /* ════════════════════════════════════════
       MISC UTILITIES
    ════════════════════════════════════════ */
    /* ════════════════════════════════════════
       CIRCUIT-STYLE: MAP + BOTTOM SHEET
    ════════════════════════════════════════ */
    .circuit-wrap {
      display: flex; flex-direction: column;
      height: calc(100vh - var(--topbar));
      overflow: hidden; position: relative;
    }
    .circuit-map {
      flex: 1; min-height: 0; position: relative;
    }
    .circuit-sheet {
      background: var(--surf0);
      border-top: 1px solid var(--border);
      display: flex; flex-direction: column;
      max-height: 55vh; min-height: 180px;
      transition: max-height .3s ease;
    }
    .circuit-sheet.expanded { max-height: 75vh; }
    .sheet-handle {
      display: flex; align-items: center; justify-content: center;
      padding: 10px 0 6px; cursor: pointer; flex-shrink: 0;
    }
    .sheet-handle-bar {
      width: 36px; height: 4px; border-radius: 2px;
      background: var(--border2);
    }
    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px 12px; flex-shrink: 0;
    }

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<script>
'use strict';

/* ══════════════════════════════════════════
   STATE — estado global da aplicação
══════════════════════════════════════════ */
const S = {
  page: 'dashboard',
  // Nova Rota
  step: 1,
  uploadedFile: null,
  stops: [],
  parseErrors: [],
  routeConfig: { name: '', startLat: '', startLon: '', mode: 'balanced', trafficKey: '' },
  generatedRoute: null,
  // UI
  leafletMap: null,
  leafletLayers: [],
  charts: {},
  activeStopIdx: null,
  searchQuery: '',
  routeGeometry: null,   // GeoJSON LineString do OSRM (rota por ruas)
};

/* ══════════════════════════════════════════
   API CLIENT
══════════════════════════════════════════ */
const API = {
  async _req(method, path, data, timeoutMs=8000) {
    const ctrl = new AbortController();
    const tid  = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const opts = { method, signal: ctrl.signal, headers: { 'Content-Type': 'application/json' } };
      if (data) opts.body = JSON.stringify(data);
      const r    = await fetch(path, opts);
      clearTimeout(tid);
      const json = await r.json();
      if (!r.ok) throw new Error(json.error || `HTTP ${r.status}`);
      return json;
    } catch(e) {
      clearTimeout(tid);
      if (e.name === 'AbortError') throw new Error('Servidor sem resposta (timeout 8s)');
      throw e;
    }
  },
  get: (p)     => API._req('GET',    p),
  post:(p, d)  => API._req('POST',   p, d),
  put: (p, d)  => API._req('PUT',    p, d),
  del: (p)     => API._req('DELETE', p),
};

/* ══════════════════════════════════════════
   ROUTING ENGINE — Haversine + NNH TSP
══════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════
   ROUTING ENGINE v2 — NNH + 2-opt + Or-opt
   ──────────────────────────────────────────────────────────────
   Pipeline de otimização:
   1. NNH  — Nearest-Neighbor Heuristic (solução inicial O(n²))
   2. 2-opt — Remove cruzamentos de rotas (O(n²) por iteração)
   3. Or-opt — Reposiciona segmentos de 1-3 paradas (O(n²))
   4. Recalculate — Recalcula distâncias acumuladas
   ──────────────────────────────────────────────────────────────
   Com OSRM Matrix: usa distâncias reais de rua em todas as etapas
   Fallback Haversine: quando OSRM indisponível
══════════════════════════════════════════════════════════════ */
const Engine = {

  haversine(lat1, lon1, lat2, lon2) {
    const R = 6371, r = d => d * Math.PI / 180;
    const dLat = r(lat2-lat1), dLon = r(lon2-lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(r(lat1))*Math.cos(r(lat2))*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  },

  parseCoords(str) {
    if (!str) return null;
    const parts = String(str).replace(/[()[\]{}]/g,'').split(',').map(s=>parseFloat(s.trim()));
    if (parts.length>=2 && !isNaN(parts[0]) && !isNaN(parts[1]) && Math.abs(parts[0])<=90 && Math.abs(parts[1])<=180)
      return { lat: parts[0], lon: parts[1] };
    return null;
  },

  naiveDist(stops) {
    return stops.length<2 ? 0 : stops.reduce((s,p,i)=>
      i===0?0:s+Engine.haversine(stops[i-1].lat,stops[i-1].lon,p.lat,p.lon),0);
  },

  /* ── Distância entre dois stops pelo índice (com cache da matriz) ── */
  _d(a, b, matDist, stops) {
    if (matDist) {
      const ai = a === -1 ? 0 : (stops[a]?.mi ?? a+1);
      const bi = b === -1 ? 0 : (stops[b]?.mi ?? b+1);
      return (matDist[ai]?.[bi] || 0) / 1000;  // km
    }
    const sa = a === -1 ? null : stops[a];
    const sb = b === -1 ? null : stops[b];
    if (!sa || !sb) return 0;
    return Engine.haversine(sa.lat, sa.lon, sb.lat, sb.lon);
  },

  /* ── Total route distance ── */
  _totalDist(order, sLat, sLon, stops, matDist) {
    let d = 0;
    for (let i = 0; i < order.length; i++) {
      const prevLat = i===0 ? sLat : stops[order[i-1]].lat;
      const prevLon = i===0 ? sLon : stops[order[i-1]].lon;
      if (matDist) {
        d += Engine._d(i===0 ? -1 : order[i-1], order[i], matDist, stops);
      } else {
        d += Engine.haversine(prevLat, prevLon, stops[order[i]].lat, stops[order[i]].lon);
      }
    }
    return d;
  },

  /* ════════════════════════════════════════
     STEP 1: NNH — Solução inicial
  ════════════════════════════════════════ */
  _nnh(stops, sLat, sLon, mode, matDist, matDur) {
    const n = stops.length;
    const visited = new Uint8Array(n);
    const order   = new Int32Array(n);
    let curLat = sLat, curLon = sLon, cur = -1;

    for (let step = 0; step < n; step++) {
      let best = -1, bestScore = Infinity;
      for (let i = 0; i < n; i++) {
        if (visited[i]) continue;
        let d, t;
        if (matDist) {
          const ci = cur === -1 ? 0 : stops[cur].mi;
          const si = stops[i].mi;
          d = (matDist[ci]?.[si] || 0) / 1000;
          t = (matDur?.[ci]?.[si]  || 0) / 60;
        } else {
          d = Engine.haversine(curLat, curLon, stops[i].lat, stops[i].lon);
          t = (d / 35) * 60;
        }
        const sc = mode==='fast'     ? t * 0.75 + d * 0.25
                 : mode==='economic' ? d
                 :                     d * 0.5 + t * 0.5;
        if (sc < bestScore) { bestScore = sc; best = i; }
      }
      visited[best] = 1;
      order[step] = best;
      if (matDist) { cur = best; }
      else { curLat = stops[best].lat; curLon = stops[best].lon; }
    }
    return Array.from(order);
  },

  /* ════════════════════════════════════════
     STEP 2: 2-opt — Elimina cruzamentos
     A melhor melhoria de qualidade por custo computacional.
     Para cada par (i,j) verifica se inverter o segmento [i+1..j]
     reduz a distância total. Se sim, aplica.
  ════════════════════════════════════════ */
  _twoOpt(order, sLat, sLon, stops, matDist, maxIter = 50) {
    const n = order.length;
    if (n < 4) return order;

    // Distância entre dois índices do order array (com depot=-1)
    const d = (a, b) => {
      const la = a < 0  ? sLat : stops[order[a]].lat;
      const lo = a < 0  ? sLon : stops[order[a]].lon;
      const lb = b >= n ? stops[order[n-1]].lat : stops[order[b]].lat;
      const llb = b >= n ? stops[order[n-1]].lon : stops[order[b]].lon;
      if (matDist) {
        const ai = a < 0  ? 0 : stops[order[a]].mi;
        const bi = b >= n ? stops[order[n-1]].mi : stops[order[b]].mi;
        return (matDist[ai]?.[bi] || 0) / 1000;
      }
      return Engine.haversine(la, lo, lb, llb);
    };

    let improved = true;
    let iter = 0;
    while (improved && iter < maxIter) {
      improved = false;
      iter++;
      for (let i = 0; i < n - 1; i++) {
        for (let j = i + 2; j < n; j++) {
          // Current: (i-1→i) + (j→j+1)
          // Proposed: (i-1→j) + (i→j+1)  [reversal of i..j]
          const cur  = d(i-1, i) + (j+1 < n ? d(j, j+1) : 0);
          const prop = d(i-1, j) + (j+1 < n ? d(i, j+1) : 0);
          if (prop < cur - 1e-10) {
            // Reverse segment [i..j]
            let lo = i, hi = j;
            while (lo < hi) {
              const tmp = order[lo]; order[lo] = order[hi]; order[hi] = tmp;
              lo++; hi--;
            }
            improved = true;
          }
        }
      }
    }
    console.log('[2-opt] ' + iter + ' iterações');
    return order;
  },

  /* ════════════════════════════════════════
     STEP 3: Or-opt — Reposiciona segmentos
     Versão segura: trabalha com cópia do array
     Testa blocos de 1, 2, 3 paradas em cada posição
  ════════════════════════════════════════ */
  _orOpt(order, sLat, sLon, stops, matDist, maxIter = 20) {
    const n = order.length;
    if (n < 5) return order;

    const dist = (ai, bi) => {
      if (ai < 0 && bi < 0) return 0;
      const sa = ai < 0 ? { lat: sLat, lon: sLon } : stops[order[ai]];
      const sb = bi < 0 ? { lat: sLat, lon: sLon } : (bi >= n ? stops[order[n-1]] : stops[order[bi]]);
      if (!sa || !sb) return 0;
      if (matDist) {
        const ma = ai < 0 ? 0 : (sa.mi || 0);
        const mb = bi < 0 ? 0 : (sb.mi || 0);
        return (matDist[ma]?.[mb] || 0) / 1000;
      }
      return Engine.haversine(sa.lat, sa.lon, sb.lat, sb.lon);
    };

    let arr = [...order];
    let improved = true, iter = 0;

    while (improved && iter < maxIter) {
      improved = false;
      iter++;

      for (let segLen = 1; segLen <= 3; segLen++) {
        for (let i = 0; i + segLen <= n; i++) {
          // Cost of removing segment [i, i+segLen-1] from current position
          const prev = i - 1;
          const next = i + segLen < n ? i + segLen : -1;

          // Edges removed: prev→i, (i+segLen-1)→next
          // Edge added: prev→next (if both valid)
          const removeCost = dist(prev, i) + (next >= 0 ? dist(i+segLen-1, i+segLen) : 0)
                           - (prev >= 0 && next >= 0 ? dist(prev, next) : 0);

          if (removeCost <= 0) continue; // no gain possible

          // Try inserting segment at each position j (not overlapping)
          for (let j = 0; j < n; j++) {
            if (j >= i - 1 && j < i + segLen) continue; // same position

            const jnext = j + 1 < n ? j + 1 : -1;

            // Make sure jnext isn't inside our segment
            if (jnext >= i && jnext < i + segLen) continue;

            // Cost of inserting segment between j and j+1
            // Use temporary remapped indices
            const insertCost = (dist(j, i) + dist(i+segLen-1, jnext >= 0 ? jnext : n-1))
                             - dist(j, jnext >= 0 ? jnext : n-1);

            if (removeCost - insertCost > 1e-10) {
              // Apply move: build new array
              const newArr = [];
              const seg = arr.slice(i, i + segLen);
              const withoutSeg = [...arr.slice(0,i), ...arr.slice(i+segLen)];
              const insertPos = j < i ? j + 1 : j + 1 - segLen;
              const clampedIns = Math.max(0, Math.min(withoutSeg.length, insertPos));
              for (let k = 0; k < withoutSeg.length; k++) {
                if (k === clampedIns) newArr.push(...seg);
                newArr.push(withoutSeg[k]);
              }
              if (newArr.length < withoutSeg.length + seg.length) newArr.push(...seg);
              if (newArr.length === n) {
                arr = newArr;
                improved = true;
              }
              break;
            }
          }
          if (improved) break;
        }
        if (improved) break;
      }
    }

    console.log('[Or-opt] ' + iter + ' iterações, n=' + n);
    return arr;
  },

  /* ── Or-opt com matriz (usa distância em metros) ── */
  _orOptMatrix(order, stops, matDist, maxIter = 20) {
    const n = order.length;
    if (n < 5) return order;

    const dist = (ai, bi) => {
      if (ai < 0 || ai >= n || bi < 0 || bi >= n) return 0;
      const ma = stops[order[ai]]?.mi || 0;
      const mb = stops[order[bi]]?.mi || 0;
      return matDist[ma]?.[mb] || 0;
    };

    let arr = [...order];
    let improved = true, iter = 0;

    while (improved && iter < maxIter) {
      improved = false; iter++;
      for (let segLen = 1; segLen <= 3; segLen++) {
        for (let i = 0; i + segLen <= n; i++) {
          const prev = i-1, next = i+segLen < n ? i+segLen : -1;
          const removeCost = (prev>=0?dist(prev,i):0) + (next>=0?dist(i+segLen-1,next):0)
                           - (prev>=0&&next>=0?dist(prev,next):0);
          if (removeCost <= 0) continue;
          for (let j = 0; j < n; j++) {
            if (j >= i-1 && j < i+segLen) continue;
            const jn = j+1<n?j+1:-1;
            if (jn >= i && jn < i+segLen) continue;
            const insertCost = (dist(j,i>0?i:0)+dist(i+segLen-1,jn>=0?jn:n-1)) - (jn>=0?dist(j,jn):0);
            if (removeCost - insertCost > 0.5) {
              const seg = arr.slice(i, i+segLen);
              const rest = [...arr.slice(0,i), ...arr.slice(i+segLen)];
              const ins = Math.max(0, Math.min(rest.length, j<i?j+1:j+1-segLen));
              const newArr = [...rest.slice(0,ins), ...seg, ...rest.slice(ins)];
              if (newArr.length === n) { arr = newArr; improved = true; }
              break;
            }
          }
          if (improved) break;
        }
        if (improved) break;
      }
    }
    return arr;
  },

    /* ════════════════════════════════════════
     STEP 4: Recalculate distances + finalize
  ════════════════════════════════════════ */
  _finalize(order, stops, sLat, sLon, matDist, matDur) {
    let accKm = 0, accSec = 0;
    return order.map((si, idx) => {
      const s    = stops[si];
      const prev = idx === 0 ? { lat: sLat, lon: sLon, mi: 0 } : stops[order[idx-1]];
      let dKm, tSec;
      if (matDist) {
        const ai = idx === 0 ? 0 : prev.mi;
        const bi = s.mi;
        dKm  = (matDist[ai]?.[bi] || 0) / 1000;
        tSec = matDur?.[ai]?.[bi] || 0;
      } else {
        dKm  = Engine.haversine(prev.lat, prev.lon, s.lat, s.lon);
        tSec = (dKm / 35) * 3600;
      }
      accKm  += dKm;
      accSec += tSec;
      return { ...s, distFromPrev: dKm, timeSec: tSec, accumulated: accKm, order: idx + 1 };
    });
  },

  /* ════════════════════════════════════════
     MAIN: buildRoute — Haversine fallback
     NNH → 2-opt → Or-opt
  ════════════════════════════════════════ */
  buildRoute(stops, sLat, sLon, mode) {
    if (!stops.length) return [];
    const t0    = performance.now();
    let   order = Engine._nnh(stops, sLat, sLon, mode, null, null);
    order = Engine._twoOpt(order, sLat, sLon, stops, null);
    order = Engine._orOpt(order, sLat, sLon, stops, null);
    const route = Engine._finalize(order, stops, sLat, sLon, null, null);
    console.log('[Route] Haversine NNH+2opt+Oropt: ' + (performance.now()-t0).toFixed(0) + 'ms');
    return route;
  },

  /* ════════════════════════════════════════
     MAIN: buildRouteMatrix — OSRM real roads
     NNH(matrix) → 2-opt(matrix) → Or-opt(matrix)
  ════════════════════════════════════════ */
  buildRouteMatrix(stops, matDur, matDist, mode) {
    if (!stops.length) return [];
    const t0      = performance.now();
    const indexed = stops.map((s, i) => ({ ...s, mi: i + 1 }));

    let order = Engine._nnh(indexed, 0, 0, mode, matDist, matDur);
    // 2-opt with real road matrix
    order = Engine._twoOptMatrix(order, indexed, matDist, 60);
    // Or-opt — lighter pass for matrix (each call is cheap, matrix already loaded)
    order = Engine._orOptMatrix(order, indexed, matDist, 30);

    const route = order.map((si, idx) => {
      const s    = indexed[si];
      const prev = idx === 0 ? 0 : indexed[order[idx-1]].mi;
      const dM   = (matDist[prev]?.[s.mi] || 0);
      const tSec = (matDur[prev]?.[s.mi]  || 0);
      return { ...s, distFromPrev: dM/1000, timeSec: tSec, accumulated: 0, order: idx+1 };
    });

    // Recalculate accumulated
    let acc = 0;
    route.forEach(r => { acc += r.distFromPrev; r.accumulated = acc; });

    console.log('[Route] OSRM NNH+2opt+Oropt: ' + (performance.now()-t0).toFixed(0) + 'ms');
    return route;
  },

  /* ── 2-opt variant using distance matrix indices ── */
  _twoOptMatrix(order, stops, matDist, maxIter = 60) {
    const n = order.length;
    if (n < 4) return order;
    const d = (ai, bi) => {
      const ma = ai < 0 ? 0 : stops[order[ai]]?.mi || 0;
      const mb = bi >= n ? stops[order[n-1]]?.mi || 0 : stops[order[bi]]?.mi || 0;
      return (matDist[ma]?.[mb] || 0);
    };
    let improved = true, iter = 0;
    while (improved && iter < maxIter) {
      improved = false; iter++;
      for (let i = 0; i < n - 1; i++) {
        for (let j = i + 2; j < n; j++) {
          const before = d(i-1, i) + (j+1<n ? d(j, j+1) : 0);
          const after  = d(i-1, j) + (j+1<n ? d(i, j+1) : 0);
          if (after < before - 0.01) {
            let lo = i, hi = j;
            while (lo < hi) { const tmp=order[lo];order[lo]=order[hi];order[hi]=tmp;lo++;hi--; }
            improved = true;
          }
        }
      }
    }
    return order;
  },

  /* ── Or-opt variant using distance matrix indices ── */
  _orOptMatrix(order, stops, matDist, maxIter = 30) {
    const n = order.length;
    if (n < 4) return order;
    const md = (ai, bi) => {
      if (ai < 0 || ai >= n || bi < 0 || bi >= n) return 0;
      return (matDist[stops[order[ai]]?.mi || 0]?.[stops[order[bi]]?.mi || 0] || 0);
    };
    let improved = true, iter = 0;
    while (improved && iter < maxIter) {
      improved = false; iter++;
      for (let segLen = 1; segLen <= Math.min(3, n-3); segLen++) {
        for (let i = 0; i <= n - segLen; i++) {
          const before = i-1, after = i+segLen < n ? i+segLen : -1;
          const remGain = (before>=0?md(before,i):0) + (after>=0?md(i+segLen-1,after):0)
                        - (before>=0&&after>=0?md(before,after):0);
          for (let j = 0; j <= n - segLen; j++) {
            if (j >= i-1 && j <= i+segLen) continue;
            const insJ = j+1<n?j+1:-1;
            const insCost = (j>=0?md(j,i):0) + (insJ>=0?md(i+segLen-1,insJ):0)
                          - (j>=0&&insJ>=0?md(j,insJ):0);
            if (remGain - insCost > 0.1) {
              const seg = order.splice(i, segLen);
              const ins = j < i ? j+1 : j+1-segLen;
              order.splice(ins, 0, ...seg);
              improved = true; break;
            }
          }
          if (improved) break;
        }
        if (improved) break;
      }
    }
    return order;
  },

  scoreMatrix(distM, timeSec, accDistM, mode) {
    const dKm = distM / 1000, tMin = timeSec / 60;
    if (mode==='fast')     return tMin*0.75 + dKm*0.25;
    if (mode==='economic') return distM;
    return dKm*0.4 + tMin*0.4 + (dKm/(accDistM/1000*0.05+1))*0.2;
  },

  score(dist, acc, mode) {
    const time = (dist/35)*60;
    if (mode==='fast')     return time*0.6 + dist*0.4;
    if (mode==='economic') return dist;
    return dist*0.5 + time*0.5;
  },
};

/* ══════════════════════════════════════════
   EXCEL PARSER
══════════════════════════════════════════ */
const Parser = {
  async parse(file) {
    return new Promise((res, rej) => {
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const wb = XLSX.read(e.target.result, { type:'array' });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'' });
          const stops=[], errors=[];
          rows.forEach((row,idx) => {
            const locStr = row['Location - Lastmile (Planned)'] || row['Location'] || row['Coordenadas'] || '';
            const coords = Engine.parseCoords(locStr);
            if (!coords) {
              if (String(locStr).trim() || Object.values(row).some(Boolean))
                errors.push({row:idx+2, id:row['Label']||`Linha ${idx+2}`,
                  reason: locStr ? `Coord inválida: "${String(locStr).slice(0,40)}"` : 'Coluna de localização vazia'});
              return;
            }
            stops.push({
              id:         String(row['Label']                      || `STOP-${idx+1}`),
              barcode:    String(row['Barcode']                    || '—'),
              company:    String(row['Company']                    || '—'),
              address:    String(row['Address Claims']             || '—'),
              postalCode: String(row['Lastmile Postal Code']       || '—'),
              status:     String(row['Order Status']               || 'Pendente'),
              lat: coords.lat, lon: coords.lon,
              rawCoords: locStr, priority: 1,
            });
          });
          res({ stops, errors, totalRows: rows.length });
        } catch(err) { rej(err); }
      };
      reader.onerror = () => rej(new Error('Erro ao ler arquivo'));
      reader.readAsArrayBuffer(file);
    });
  },
};

/* ══════════════════════════════════════════
   ROTEAMENTO — OSRM (grátis) + TomTom Traffic (chave API)
   
   OSRM:
     ✅ Respeita mão única e sentido das vias
     ✅ Velocidade por tipo de via (rodovia, urbana, etc.)
     ❌ Sem trânsito em tempo real
   
   TomTom Routing API (chave gratuita: developer.tomtom.com):
     ✅ Trânsito em tempo real
     ✅ Mão única e sentido correto das vias
     ✅ Evita congestionamentos automaticamente
     ✅ ETA real com impacto do trânsito
══════════════════════════════════════════ */

/* ══════════════════════════════════════════
   GEOCODING — Nominatim (OpenStreetMap)
   Address → coordinates, free, no API key
══════════════════════════════════════════ */
const Geocoder = {
  async search(query) {
    if (!query || query.trim().length < 3) return [];
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&addressdetails=1&q='
              + encodeURIComponent(query.trim());
    const r = await fetch(url, {
      headers: { 'Accept-Language': 'pt-BR,pt', 'User-Agent': 'RoteiroPro/1.0' },
      signal: AbortSignal.timeout(6000),
    });
    if (!r.ok) throw new Error('Geocoder HTTP ' + r.status);
    const results = await r.json();
    return results.map(item => ({
      label:      item.display_name,
      short:      (item.address?.road||item.address?.suburb||item.name||item.display_name).slice(0,60),
      city:       item.address?.city || item.address?.town || item.address?.municipality || '',
      lat:        parseFloat(item.lat),
      lon:        parseFloat(item.lon),
    }));
  },

  async reverse(lat, lon) {
    const url = 'https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lon;
    const r = await fetch(url, {
      headers: { 'Accept-Language': 'pt-BR,pt', 'User-Agent': 'RoteiroPro/1.0' },
      signal: AbortSignal.timeout(5000),
    });
    if (!r.ok) return null;
    const d = await r.json();
    const addr = d.address;
    return (addr?.road ? addr.road + (addr?.house_number?' '+addr.house_number:'') : d.display_name.split(',')[0])
         + (addr?.city||addr?.town ? ', '+(addr.city||addr.town) : '');
  },
};

/* ── OSRM (sem trânsito, mas respeita sentido das vias) ── */
const OSRM = {
  BASE: 'https://router.project-osrm.org',

  _coords(pts) { return pts.map(p => `${+p.lon},${+p.lat}`).join(';'); },

  async _fetch(url, ms = 18000) {
    const ctrl = new AbortController();
    const tid  = setTimeout(() => ctrl.abort(), ms);
    let r;
    try   { r = await fetch(url, { signal: ctrl.signal }); }
    catch (e) {
      clearTimeout(tid);
      throw new Error(e.name === 'AbortError' ? 'Timeout OSRM (' + ms/1000 + 's)' : e.message);
    }
    clearTimeout(tid);
    if (!r.ok) throw new Error('OSRM HTTP ' + r.status);
    const d = await r.json();
    if (d.code && d.code !== 'Ok') throw new Error('OSRM: ' + (d.message || d.code));
    return d;
  },

  async getMatrix(pts) {
    const d = await this._fetch(
      `${this.BASE}/table/v1/driving/${this._coords(pts)}?annotations=duration,distance`
    );
    if (!d.durations || !d.distances) throw new Error('OSRM: matriz sem dados');
    return { durations: d.durations, distances: d.distances };
  },

  async getRoute(pts) {
    const CHUNK = 23;
    let allCoords = [], legs = [], totalDistM = 0, totalTimeSec = 0;
    for (let i = 0; i < pts.length - 1; i += CHUNK - 1) {
      const chunk = pts.slice(i, Math.min(i + CHUNK, pts.length));
      if (chunk.length < 2) break;
      const d = await this._fetch(
        `${this.BASE}/route/v1/driving/${this._coords(chunk)}?overview=full&geometries=geojson`
      );
      const rt = d.routes[0];
      totalDistM   += rt.distance;
      totalTimeSec += rt.duration;
      const coords = rt.geometry.coordinates;
      if (allCoords.length > 0) coords.shift();
      allCoords = allCoords.concat(coords);
      rt.legs.forEach(l => legs.push({ distM: l.distance, timeSec: l.duration }));
    }
    return { geometry: { type: 'LineString', coordinates: allCoords }, totalDistM, totalTimeSec, legs };
  },
};

/* ── TomTom Routing API (com trânsito real) ── *
 *
 *  Estratégia:
 *  - ORDENAÇÃO das paradas → OSRM Matrix (rápido, 1 chamada, gratuito)
 *  - TRAÇADO FINAL + tempos reais → TomTom calculateRoute (1 chamada, com trânsito)
 *
 *  Assim TomTom consome apenas 1 requisição por rota completa,
 *  independente do número de paradas.
 */
const TomTom = {

  async _fetch(url, ms = 25000) {
    const ctrl = new AbortController();
    const tid  = setTimeout(() => ctrl.abort(), ms);
    let r;
    try {
      r = await fetch(url, { signal: ctrl.signal });
    } catch(e) {
      clearTimeout(tid);
      throw new Error(e.name === 'AbortError' ? 'TomTom timeout (' + (ms/1000) + 's)' : e.message);
    }
    clearTimeout(tid);

    // Captura body para diagnóstico mesmo em erro
    const text = await r.text();
    if (!r.ok) {
      let detail = '';
      try {
        const j = JSON.parse(text);
        detail = j.detailedError?.message || j.message || j.description || text.slice(0, 120);
      } catch(_) { detail = text.slice(0, 120); }
      throw new Error('TomTom HTTP ' + r.status + (detail ? ': ' + detail : ''));
    }
    try { return JSON.parse(text); }
    catch(_) { throw new Error('TomTom: resposta inválida (não é JSON)'); }
  },

  /**
   * calculateRoute — 1 chamada com todos os waypoints + trânsito real.
   * Retorna geometria completa e legs por trecho.
   * URL: /routing/1/calculateRoute/{lat,lon:lat,lon:...}/json
   *
   * NOTA: sem routeRepresentation (usa default = polyline com legs.points)
   *       sem sectionType (evita alterar estrutura da resposta)
   */
  async getRoute(pts, apiKey) {
    if (!apiKey) throw new Error('Chave TomTom não informada');
    if (pts.length < 2) throw new Error('Mínimo 2 pontos');

    // TomTom aceita até 150 waypoints na URL
    // Formato: lat,lon:lat,lon:...
    const waypointStr = pts.map(p => (+p.lat).toFixed(6) + ',' + (+p.lon).toFixed(6)).join(':');
    const url = 'https://api.tomtom.com/routing/1/calculateRoute/'
              + waypointStr + '/json'
              + '?key=' + apiKey
              + '&traffic=true'
              + '&travelMode=car'
              + '&routeType=fastest'
              + '&computeBestOrder=false';

    console.log('[TomTom] Calculando rota com ' + pts.length + ' pontos...');
    const d = await this._fetch(url, 28000);

    if (!d.routes || !d.routes.length) {
      throw new Error('TomTom: sem rota na resposta. Verifique se as coordenadas são válidas.');
    }

    const route = d.routes[0];

    // Validar estrutura esperada
    if (!route.summary) throw new Error('TomTom: resposta sem summary');
    if (!route.legs || !route.legs.length) throw new Error('TomTom: resposta sem legs');

    const totalDistM   = route.summary.lengthInMeters        || 0;
    const totalTimeSec = route.summary.travelTimeInSeconds   || 0;
    const trafficSec   = route.summary.trafficDelayInSeconds || 0;

    // Legs — um por trecho entre waypoints consecutivos
    const legs = route.legs.map((leg, i) => {
      if (!leg.summary) throw new Error('TomTom: leg ' + i + ' sem summary');
      return {
        distM:      leg.summary.lengthInMeters        || 0,
        timeSec:    leg.summary.travelTimeInSeconds   || 0,
        trafficSec: leg.summary.trafficDelayInSeconds || 0,
      };
    });

    // Geometria: concatena leg.points de cada trecho
    // leg.points = [{ latitude, longitude }, ...]
    let allCoords = [];
    route.legs.forEach((leg, li) => {
      if (!leg.points || !leg.points.length) return;
      const pts2 = leg.points.map(p => [p.longitude, p.latitude]); // [lon, lat] para GeoJSON
      if (li > 0 && allCoords.length > 0) pts2.shift(); // remove ponto duplicado da junção
      allCoords = allCoords.concat(pts2);
    });

    if (!allCoords.length) {
      throw new Error('TomTom: geometria vazia (leg.points ausente). Tente sem o parâmetro routeRepresentation.');
    }

    console.log('[TomTom] OK: ' + (totalDistM/1000).toFixed(1) + ' km, '
      + Math.round(totalTimeSec/60) + ' min, delay ' + Math.round(trafficSec/60) + ' min');

    return {
      geometry: { type: 'LineString', coordinates: allCoords },
      totalDistM, totalTimeSec, trafficSec, legs,
    };
  },
};

/* ── Seleciona motor conforme chave disponível ──
 *
 *  getMatrix → sempre OSRM (rápido, 1 chamada, adequado para ordenação)
 *  getRoute  → TomTom se chave disponível (trânsito real + geometria precisa)
 *              OSRM como fallback (sem trânsito mas respeita sentido das vias)
 */
const Router = {
  hasTraffic() { return !!(S.routeConfig.trafficKey?.trim()); },

  // Matriz sempre via OSRM — rápido e suficiente para o NNH de ordenação
  async getMatrix(pts) {
    return OSRM.getMatrix(pts);
  },

  // Rota final: TomTom com trânsito real ou OSRM como fallback
  async getRoute(pts) {
    if (this.hasTraffic()) {
      return TomTom.getRoute(pts, S.routeConfig.trafficKey.trim());
    }
    return OSRM.getRoute(pts);
  },
};

/* ══════════════════════════════════════════
   MAP MANAGER
══════════════════════════════════════════ */
const MapMgr = {
  instance: null,
  layers: [],

  init(elId, lat, lon, zoom=12) {
    this.destroy();
    this.instance = L.map(elId, {zoomControl:true}).setView([+lat,+lon],zoom);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
      { attribution:'© CartoDB · © OSRM · © OpenStreetMap', maxZoom:19 }).addTo(this.instance);
    S.leafletMap = this.instance;
  },

  /**
   * Desenha a rota no mapa.
   * Se `geometry` (GeoJSON LineString do OSRM) for fornecida,
   * desenha o traçado real pelas ruas.
   * Caso contrário, tenta buscar do OSRM automaticamente.
   * Em último caso, usa linha reta tracejada como fallback.
   */
  async drawRoute(route, sLat, sLon, geometry = null) {
    this.clearLayers();
    const sLatN = +sLat, sLonN = +sLon;

    // ── Tentar obter geometria de rua se não fornecida ──
    let roadGeo = geometry;
    if (!roadGeo) {
      try {
        const pts = [
          { lat: sLatN, lon: sLonN },
          ...route.map(s => ({ lat: +s.lat, lon: +s.lon })),
        ];
        this._setMapStatus('📡 Traçando rota pelas ruas...');
        // Usa OSRM.getRoute (existe) — NÃO getRouteGeometry (removido)
        const osrmResult = await OSRM.getRoute(pts);
        roadGeo = osrmResult.geometry;
      } catch(e) {
        console.warn('[Map] Geometria indisponível, linha reta:', e.message);
        roadGeo = null;
      }
      this._setMapStatus(null);
    }

    // ── Desenhar polyline ──
    if (roadGeo && roadGeo.coordinates && roadGeo.coordinates.length > 1) {
      const latlngs = roadGeo.coordinates.map(c => [c[1], c[0]]);
      const poly = L.polyline(latlngs, {
        color: '#60a5fa', weight: 4, opacity: 0.9,
      }).addTo(this.instance);
      this.layers.push(poly);
      this.instance.fitBounds(poly.getBounds(), { padding: [40, 40] });
    } else {
      // Fallback: linha reta tracejada amarela
      const lls = [[sLatN, sLonN], ...route.map(s => [+s.lat, +s.lon])];
      const poly = L.polyline(lls, {
        color: '#f59e0b', weight: 2, dashArray: '8 5', opacity: 0.7,
      }).addTo(this.instance);
      this.layers.push(poly);
      if (lls.length > 1) this.instance.fitBounds(poly.getBounds(), { padding: [40, 40] });
      this._showFallbackBadge();
    }

    // ── Marcadores ──
    this._addMarker(sLatN, sLonN, '#f59e0b', 'S', '<b>📍 Ponto de Partida</b>', true);
    route.forEach(s => {
      const ord  = s.order || s.sequence_order || '?';
      const lbl  = s.label || s.id || '—';
      const dkm  = +(s.dist_from_prev ?? s.distFromPrev ?? 0);
      const tSec = s.timeSec || 0;
      const trSec= s.trafficSec || 0;
      const addr = s.address || s.delivery_status || '';
      const popupHtml = `
        <div style="font-family:sans-serif;min-width:200px;padding:4px">
          <b style="font-size:13px">#${ord} — ${lbl}</b><br>
          <span style="color:#555;font-size:11px">${addr}</span><br>
          <span style="font-size:11px;color:#3b82f6">📏 +${dkm.toFixed(2)} km por rua</span><br>
          ${tSec ? `<span style="font-size:11px;color:#f59e0b">⏱ ${Math.round(tSec/60)} min</span>` : ''}
          ${trSec > 30 ? `<span style="font-size:11px;color:#ef4444"> · 🚦 +${Math.round(trSec/60)} min trânsito</span>` : ''}
        </div>`;
      this._addMarker(+s.lat, +s.lon, ord === 1 ? '#f87171' : '#3b82f6', ord, popupHtml);
    });
  },

  _addMarker(lat, lon, color, label, popup, isStart=false) {
    const isS = isStart || label==='S';
    const m = L.marker([lat,lon],{icon:L.divIcon({
      html:`<div style="background:${color};min-width:26px;height:26px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:${isS?13:9}px;font-weight:900;color:${isS?'#000':'white'};box-shadow:0 0 10px ${color}88">${label}</div>`,
      iconSize:[26,26],iconAnchor:[13,13],className:'',
    })}).bindPopup(popup).addTo(this.instance);
    this.layers.push(m);
  },

  _setMapStatus(msg) {
    let el = document.getElementById('map-status-overlay');
    if (!msg) { if(el) el.remove(); return; }
    if (!el) {
      el = document.createElement('div');
      el.id = 'map-status-overlay';
      el.style.cssText = 'position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1000;background:rgba(9,17,31,.9);border:1px solid #1a2744;border-radius:8px;padding:7px 14px;font-size:12px;color:#e2e8f0;backdrop-filter:blur(8px);pointer-events:none;white-space:nowrap';
      const mapEl = this.instance.getContainer();
      mapEl.style.position = 'relative';
      mapEl.appendChild(el);
    }
    el.textContent = msg;
  },

  _showFallbackBadge() {
    let el = document.getElementById('map-fallback-badge');
    if (el) return;
    el = document.createElement('div');
    el.id = 'map-fallback-badge';
    el.style.cssText = 'position:absolute;bottom:36px;left:10px;z-index:1000;background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.4);border-radius:6px;padding:5px 10px;font-size:11px;color:#f59e0b;pointer-events:none';
    el.textContent = '⚠️ Linha reta (OSRM indisponível)';
    const mapEl = this.instance.getContainer();
    mapEl.style.position = 'relative';
    mapEl.appendChild(el);
  },

  clearLayers() {
    this.layers.forEach(l=>{try{this.instance.removeLayer(l);}catch(e){}});
    this.layers=[];
  },

  destroy() {
    if (this.instance) { this.instance.remove(); this.instance=null; this.layers=[]; S.leafletMap=null; }
  },

  invalidate() { setTimeout(()=>this.instance&&this.instance.invalidateSize(),250); },
};

/* ══════════════════════════════════════════
   UI HELPERS
══════════════════════════════════════════ */
function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  const icons = {success:'✅',error:'❌',info:'ℹ️'};
  el.innerHTML = `<span>${icons[type]||'📢'}</span> ${msg}`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(), 3500);
}

function confirm(title, body, onConfirm) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').textContent = body;
  document.getElementById('modal-actions').innerHTML = `
    <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-danger btn-sm" id="modal-confirm-btn">Confirmar</button>`;
  document.getElementById('modal-confirm-btn').onclick = () => { onConfirm(); closeModal(); };
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function setPage(title, subtitle='', actions='') {
  const titleEl = document.getElementById('page-title');
  const subEl   = document.getElementById('page-subtitle');
  const actEl   = document.getElementById('topbar-actions');
  if (titleEl) titleEl.textContent = title;
  if (subEl)   subEl.textContent   = subtitle;
  if (actEl)   actEl.innerHTML     = actions;
  document.querySelectorAll('.nav-item, .bn-item').forEach(el =>
    el.classList.toggle('active', el.dataset.page === S.page));
}

function h(strings, ...vals) {
  return strings.reduce((r,s,i)=>r+s+(vals[i]!=null?String(vals[i]):''),'');
}

function fmtDate(dt) {
  if (!dt) return '—';
  return new Date(dt).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

function fmtMode(mode) {
  const m = {fast:'⚡ Rápido',economic:'🌿 Econômico',balanced:'⚖️ Balanceado'};
  return m[mode]||mode;
}

function modeBadge(mode) {
  const classes={fast:'badge-amber',economic:'badge-green',balanced:'badge-blue'};
  return `<span class="badge ${classes[mode]||'badge-gray'}">${fmtMode(mode)}</span>`;
}

function statusBadge(status) {
  const cfg={ativa:{cl:'badge-green',label:'Ativa'},concluida:{cl:'badge-blue',label:'Concluída'},cancelada:{cl:'badge-gray',label:'Cancelada'}};
  const c=cfg[status]||{cl:'badge-gray',label:status};
  return `<span class="badge ${c.cl}">● ${c.label}</span>`;
}

function deliveryStatusBadge(status) {
  if (!status||status==='—') return `<span class="badge badge-gray">${status||'—'}</span>`;
  const cls={Pendente:'badge-amber',Entregue:'badge-green',Ausente:'badge-red'};
  return `<span class="badge ${cls[status]||'badge-gray'}">${status}</span>`;
}

function kpiCard(icon, value, label, color='var(--blue)', sub='') {
  return `<div class="kpi-card" style="--kpi-color:${color}">
    <div class="kpi-icon">${icon}</div>
    <div class="kpi-value">${value}</div>
    <div class="kpi-label">${label}</div>
    ${sub?`<div class="kpi-sub">${sub}</div>`:''}
  </div>`;
}

/* ══════════════════════════════════════════
   NAVIGATION
══════════════════════════════════════════ */
async function nav(page, params={}) {
  S.page   = page;
  S.params = params;
  MapMgr.destroy();
  Object.values(S.charts).forEach(c => { try { c.destroy && c.destroy(); } catch(e){} });
  S.charts = {};
  document.querySelectorAll('.nav-item').forEach(el =>
    el.classList.toggle('active', el.dataset.page === page));
  try {
    await renderPage(page, params);
  } catch(err) {
    console.error('[nav] Erro ao renderizar página', page, err);
    const pc = document.getElementById('page-content');
    if (pc) pc.innerHTML = `
      <div class="empty-state" style="margin-top:60px">
        <div class="empty-icon">⚠️</div>
        <div class="empty-title">Erro ao carregar página</div>
        <div class="empty-sub" style="font-family:monospace;font-size:12px;color:var(--red2)">
          ${err.message}
        </div>
        <button class="btn btn-ghost mt-24" onclick="nav('dashboard')">← Voltar ao Dashboard</button>
      </div>`;
  }
  updateBadge();
}

async function renderPage(page, params) {
  switch(page) {
    case 'setup':        renderSetup(); break;
    case 'dashboard':    await renderDashboard(); break;
    case 'nova-rota':    renderNovaRota(); break;
    case 'rotas':        await renderRotas(); break;
    case 'uploads':      await renderUploads(); break;
    case 'settings':     await renderSettings(); break;
    case 'rota-detalhe': await renderRotaDetalhe(params.id); break;
  }
}

async function updateBadge() {
  try {
    const routes = await API.get('/api/routes');
    const n = routes.length;
    // Desktop sidebar badge
    const badge = document.getElementById('routes-badge');
    if (badge) badge.textContent = n;
    // Mobile bottom nav badge
    const bnBadge = document.getElementById('bn-badge');
    if (bnBadge) {
      bnBadge.textContent = n;
      bnBadge.style.display = n > 0 ? 'block' : 'none';
    }
  } catch(e) {}
}

function renderNovaRota() {
  const labels = ['Upload', 'Paradas', 'Rota', 'Resultado'];
  const cur    = S.step;
  // Steps 2-4: full-height circuit layout — remove padding
  const pc = document.getElementById('page-content');
  if (cur >= 2) {
    pc.style.padding = '0';
    pc.style.overflow = 'hidden';
    pc.classList.add('circuit-page');
  } else {
    pc.style.padding = '';
    pc.style.overflow = '';
    pc.classList.remove('circuit-page');
  }

  const backBtn = cur > 1
    ? `<button class="btn btn-ghost btn-sm" onclick="goStep(${cur-1})">← Voltar</button>`
    : '';
  const stepLabel = labels[cur-1] || '';
  setPage(
    stepLabel,
    cur + ' / ' + labels.length,
    backBtn
  );

  pc.innerHTML = '<div id="step-content"></div>';
  renderStep(S.step);
}

function renderStep(n) {
  const el = document.getElementById('step-content');
  if (!el) return;
  if (n===1) renderStep1(el);
  else if (n===2) renderStep2(el);
  else if (n===3) renderStep3(el);
  else if (n===4) renderStep4(el);
}

function goStep(n) {
  MapMgr.destroy();
  if (S._pickerMap) { try { S._pickerMap.remove(); } catch(e){} S._pickerMap = null; }
  S.step = n;
  renderNovaRota();
}

async function handleFileSelect(file) {
  if (!file) return;
  if (!file.name.match(/\.(xlsx|xls)$/i)) { toast('Envie um arquivo .xlsx ou .xls','error'); return; }

  const icon = document.getElementById('upload-icon');
  const title = document.getElementById('upload-title');
  const sub = document.getElementById('upload-sub');
  if(icon) icon.textContent='⏳';
  if(title) title.textContent='Processando planilha...';
  if(sub) sub.textContent='Aguarde um momento';

  try {
    const result = await Parser.parse(file);
    S.stops = result.stops;
    S.parseErrors = result.errors;
    S.uploadedFile = file;

    // Log upload to API
    await API.post('/api/uploads', { filename: file.name, totalRows: result.totalRows, validRows: result.stops.length, errorRows: result.errors.length }).catch(()=>{});

    toast(`${result.stops.length} paradas carregadas com sucesso!`);
    goStep(2);
  } catch(e) {
    toast('Erro ao processar: ' + e.message, 'error');
    if(icon) icon.textContent='❌';
    if(title) title.textContent='Erro ao processar arquivo';
    if(sub) sub.textContent=e.message;
  }
}

/* ── Location Picker Modal ── */
function openLocationPicker() {
  const existing = document.getElementById('loc-modal');
  if (existing) existing.remove();

  const initLat = S.routeConfig.startLat || (S.stops.length ? S.stops[0].lat : 38.71);
  const initLon = S.routeConfig.startLon || (S.stops.length ? S.stops[0].lon : -9.14);

  const modal = document.createElement('div');
  modal.id = 'loc-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;';
  modal.innerHTML =
    '<div style="display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);background:var(--surf0);flex-shrink:0">' +
      '<button class="btn btn-ghost btn-sm" onclick="document.getElementById(\'loc-modal\').remove()">✕</button>' +
      '<div style="font-size:16px;font-weight:700">Ponto de Partida</div>' +
    '</div>' +
    '<div style="padding:12px 16px;background:var(--surf0);border-bottom:1px solid var(--border);flex-shrink:0;position:relative">' +
      '<div style="display:flex;gap:8px;align-items:center">' +
        '<input id="addr-search" class="form-input" placeholder="🔍 Pesquisar endereço ou rua..." style="flex:1;font-size:14px" oninput="onAddrInput(this.value)" autocomplete="off"/>' +
        '<button class="btn btn-ghost btn-sm" id="gps-modal-btn" onclick="autoGpsModal()" style="white-space:nowrap;flex-shrink:0">📍 GPS</button>' +
      '</div>' +
      '<div id="addr-results" style="position:absolute;left:16px;right:16px;top:calc(100% - 1px);background:var(--surf1);border:1px solid var(--border2);border-radius:0 0 10px 10px;z-index:10;max-height:240px;overflow-y:auto;display:none"></div>' +
    '</div>' +
    '<div id="loc-map-el" style="flex:1;min-height:0;background:var(--surf0)"></div>' +
    '<div style="padding:12px 16px;border-top:1px solid var(--border);background:var(--surf0);flex-shrink:0">' +
      '<div id="loc-addr-label" style="font-size:12px;color:var(--text3);margin-bottom:10px;min-height:16px;font-family:monospace">' +
        (S.routeConfig.startLabel
          ? '<span style="color:var(--green2)">📍 ' + S.routeConfig.startLabel + '</span>'
          : 'Toque no mapa, pesquise ou use o GPS') +
      '</div>' +
      '<button class="btn btn-primary btn-lg w-full" style="justify-content:center" onclick="confirmLocModal()">✅ Confirmar partida</button>' +
    '</div>';
  document.body.appendChild(modal);

  setTimeout(() => {
    if (!window.L) { console.warn('Leaflet not loaded'); return; }
    const lmap = L.map('loc-map-el', { zoomControl: true }).setView([initLat, initLon], 14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
      { attribution: '©CartoDB · ©OSM', maxZoom: 19 }).addTo(lmap);

    let mk = S.routeConfig.startLat
      ? L.marker([initLat, initLon], { draggable: true }).addTo(lmap)
      : null;
    if (mk) mk.on('dragend', e => _pinLoc(e.target.getLatLng().lat, e.target.getLatLng().lng, true));

    lmap.on('click', e => {
      if (mk) lmap.removeLayer(mk);
      mk = L.marker([e.latlng.lat, e.latlng.lng], { draggable: true }).addTo(lmap);
      mk.on('dragend', ev => _pinLoc(ev.target.getLatLng().lat, ev.target.getLatLng().lng, true));
      _pinLoc(e.latlng.lat, e.latlng.lng, true);
    });

    S._lmap = lmap;
    S._getLmk = () => mk;
    S._setLmk = m => { mk = m; };

    async function _pinLoc(la, lo, doReverse) {
      S._pendingLat = la; S._pendingLon = lo;
      const lbl = document.getElementById('loc-addr-label');
      if (lbl) lbl.innerHTML = '<span style="color:var(--text3)">📍 ' + la.toFixed(5) + ', ' + lo.toFixed(5) + '</span>';
      if (doReverse) {
        if (lbl) lbl.innerHTML = '<span style="color:var(--text3)">🔄 Identificando endereço...</span>';
        const addr = await Geocoder.reverse(la, lo).catch(() => null);
        if (lbl) lbl.innerHTML = '<span style="color:var(--green2)">📍 ' + (addr || la.toFixed(5) + ', ' + lo.toFixed(5)) + '</span>';
        const inp = document.getElementById('addr-search');
        if (inp && addr) inp.value = addr;
      }
    }
    S._pinLoc = _pinLoc;
    // Auto GPS
    setTimeout(autoGpsModal, 400);
  }, 120);
}

async function autoGpsModal() {
  const btn = document.getElementById('gps-modal-btn');
  if (btn) btn.innerHTML = '📡...';
  if (!navigator.geolocation) { if (btn) btn.innerHTML = '📍 GPS'; return; }
  navigator.geolocation.getCurrentPosition(
    async pos => {
      const la = pos.coords.latitude, lo = pos.coords.longitude;
      const lmap = S._lmap;
      if (lmap) {
        const cur = S._getLmk && S._getLmk();
        if (cur) lmap.removeLayer(cur);
        const newMk = L.marker([la,lo],{draggable:true}).addTo(lmap);
        newMk.on('dragend', e => S._pinLoc && S._pinLoc(e.target.getLatLng().lat, e.target.getLatLng().lng, true));
        S._setLmk && S._setLmk(newMk);
        lmap.setView([la,lo],15);
      }
      if (S._pinLoc) await S._pinLoc(la, lo, true);
      if (btn) btn.innerHTML = '✅';
      setTimeout(() => { if (btn) btn.innerHTML = '📍 GPS'; }, 2000);
    },
    err => {
      if (btn) btn.innerHTML = '📍 GPS';
      const isHttp = location.protocol==='http:' && !['localhost','127.0.0.1'].includes(location.hostname);
      const lbl = document.getElementById('loc-addr-label');
      if (lbl) lbl.innerHTML = isHttp
        ? '<span style="color:var(--amber)">⚠️ GPS requer HTTPS. Use o mapa ou pesquise o endereço.</span>'
        : '<span style="color:var(--red2)">⚠️ ' + (err.code===1?'Permissão negada':'GPS indisponível') + '. Use o mapa ou pesquise.</span>';
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

let _addrDebounce = null;
function onAddrInput(val) {
  const res = document.getElementById('addr-results');
  clearTimeout(_addrDebounce);
  if (!val || val.length < 3) { if (res) res.style.display = 'none'; return; }
  _addrDebounce = setTimeout(async () => {
    try {
      const results = await Geocoder.search(val);
      if (!results.length) { if (res) res.style.display = 'none'; return; }
      if (res) {
        res.style.display = 'block';
        res.innerHTML = results.map((r, i) =>
          '<div style="padding:12px 16px;border-bottom:1px solid var(--border2);cursor:pointer" ' +
            'onmouseover="this.style.background=\'var(--surf2)\'" onmouseout="this.style.background=\'\' " ' +
            'onclick="selectAddrResult(' + i + ')">' +
            '<div style="font-size:13px;font-weight:600;color:var(--text)">' + r.short + '</div>' +
            '<div style="font-size:11px;color:var(--text3);margin-top:2px">' + r.label.slice(0,80) + '</div>' +
          '</div>'
        ).join('');
        S._addrResults = results;
      }
    } catch(e) { if (res) res.style.display = 'none'; }
  }, 400);
}

async function selectAddrResult(i) {
  const r = S._addrResults?.[i];
  if (!r) return;
  const res = document.getElementById('addr-results');
  const inp = document.getElementById('addr-search');
  if (res) res.style.display = 'none';
  if (inp) inp.value = r.short + (r.city ? ', ' + r.city : '');
  const lmap = S._lmap;
  if (lmap) {
    const cur = S._getLmk && S._getLmk();
    if (cur) lmap.removeLayer(cur);
    const newMk = L.marker([r.lat, r.lon], { draggable: true }).addTo(lmap);
    newMk.on('dragend', e => S._pinLoc && S._pinLoc(e.target.getLatLng().lat, e.target.getLatLng().lng, true));
    S._setLmk && S._setLmk(newMk);
    lmap.setView([r.lat, r.lon], 15);
  }
  if (S._pinLoc) await S._pinLoc(r.lat, r.lon, false);
  const lbl = document.getElementById('loc-addr-label');
  if (lbl) lbl.innerHTML = '<span style="color:var(--green2)">📍 ' + r.short + (r.city?', '+r.city:'') + '</span>';
}

async function testTomTomKeyModal() {
  const key = (document.getElementById('tmk-in')?.value || '').trim();
  const st  = document.getElementById('tmk-status');
  const btn = document.getElementById('tmk-test-btn');
  if (!key) { if (st) st.innerHTML = '<span style="color:var(--red2)">Cole a chave primeiro</span>'; return; }
  if (btn) btn.innerHTML = '⏳...';
  if (st)  st.innerHTML  = '<span style="color:var(--text3)">Testando...</span>';
  try {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 12000);
    const r = await fetch(
      'https://api.tomtom.com/routing/1/calculateRoute/-38.5,-9.1:-38.51,-9.11/json?key=' + key + '&travelMode=car&traffic=true',
      { signal: ctrl.signal }
    );
    const d = await r.json();
    if (r.ok && d.routes?.length) {
      if (st) st.innerHTML = '<span style="color:var(--green2)">✅ Chave válida! TomTom ativo.</span>';
      S._pendingTMKey = key;
    } else if (r.status === 403) {
      if (st) st.innerHTML = '<span style="color:var(--red2)">❌ Chave inválida (403). Verifique no dashboard TomTom.</span>';
    } else {
      if (st) st.innerHTML = '<span style="color:var(--red2)">❌ HTTP ' + r.status + '</span>';
    }
  } catch(e) {
    if (st) st.innerHTML = '<span style="color:var(--red2)">❌ ' + (e.name==='AbortError'?'Timeout (12s)':e.message) + '</span>';
  } finally {
    if (btn) btn.innerHTML = '🔑 Testar';
  }
}

async function saveTomTomKeyModal() {
  const key = S._pendingTMKey || (document.getElementById('tmk-in')?.value || '').trim();
  if (key) {
    S.routeConfig.trafficKey = key;
    try { await API.post('/api/config', { tomtom_key: key }); toast('✅ Chave TomTom salva!'); } catch(e) {}
  }
  document.getElementById('tm-modal')?.remove();
  renderStep3(document.getElementById('step-content'));
}

/* ── toggleSheet ── */
function toggleSheet(idOrEl) {

  const el = id ? document.getElementById(id) : null;
  if (el) el.classList.toggle('expanded');
}


async function generateRoute() {
  // ── Validar ponto de partida ──
  const latRaw = (document.getElementById('startLat')?.value || String(S.routeConfig.startLat || '')).trim();
  const lonRaw = (document.getElementById('startLon')?.value || String(S.routeConfig.startLon || '')).trim();
  const name   = document.getElementById('routeName')?.value?.trim();
  const sLat   = parseFloat(latRaw), sLon = parseFloat(lonRaw);

  if (!latRaw || !lonRaw || isNaN(sLat) || isNaN(sLon)) {
    const w = document.getElementById('config-warning');
    if (w) { w.style.display = 'block'; w.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    return;
  }

  S.routeConfig = {
    ...S.routeConfig,
    startLat:   sLat,
    startLon:   sLon,
    name: name || 'Rota ' + new Date().toLocaleDateString('pt-BR'),
    trafficKey: document.getElementById('trafficKey')?.value?.trim() || S.routeConfig.trafficKey || '',
  };

  const useTraffic = !!(S.routeConfig.trafficKey);
  const engineName = useTraffic ? '🚦 TomTom (trânsito real)' : '🛣️ OSRM';

  // ── Bloquear botão ──
  const btn = document.querySelector('button[onclick="generateRoute()"]');
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Calculando rota...'; }
  const resetBtn = () => { if (btn) { btn.disabled = false; btn.innerHTML = '⚡ Gerar Rota Otimizada'; } };

  const start     = { lat: sLat, lon: sLon };
  const allPts    = [start, ...S.stops];
  let route, geometry = null, trafficDelayTotal = 0;

  /* ═══════════════════════════════════════════
     ETAPA 1 — Matriz de distâncias por rua
     Router.getMatrix usa TomTom (com trânsito)
     ou OSRM (sem trânsito, mas respeita mão única)
  ═══════════════════════════════════════════ */
  try {
    _setStepProgress('📡 OSRM: calculando matriz de distâncias por rua (' + S.stops.length + ' paradas)…');
    const matrix = await Router.getMatrix(allPts);

    _setStepProgress('🧠 Otimizando ordem: NNH + 2-opt + Or-opt…');
    route = Engine.buildRouteMatrix(
      S.stops, matrix.durations, matrix.distances, S.routeConfig.mode
    );
    console.log(`[${engineName}] Matriz OK → ${route.length} paradas ordenadas`);

  } catch(e) {
    console.warn('[OSRM Matrix falhou]', e.message);
    toast('⚠️ OSRM Matrix: ' + e.message + ' — usando distância linear', 'error');
    route = Engine.buildRoute(S.stops, sLat, sLon, S.routeConfig.mode);
  }

  /* ═══════════════════════════════════════════
     ETAPA 2 — Traçado real pelas ruas + km/tempo por trecho
     Ponto final = última parada da rota (não retorna ao depósito)
  ═══════════════════════════════════════════ */
  try {
    // Pontos ordenados: partida → paradas → FIM na última parada
    const orderedPts = [start, ...route.map(s => ({ lat: s.lat, lon: s.lon }))];
    _setStepProgress('🛣️ ' + engineName + ': traçando percurso por ruas (' + (orderedPts.length-1) + ' trechos)…');

    const roadRoute = await Router.getRoute(orderedPts);
    geometry = roadRoute.geometry;

    // Atualizar cada parada com km e tempo REAIS do trecho (leg)
    let accKm = 0;
    roadRoute.legs.forEach((leg, i) => {
      if (!route[i]) return;
      route[i].distFromPrev = +(leg.distM   / 1000).toFixed(3);
      route[i].timeSec      = leg.timeSec;
      route[i].trafficSec   = leg.trafficSec || roadRoute.trafficSec || 0;
      accKm += route[i].distFromPrev;
      route[i].accumulated  = +accKm.toFixed(3);
      trafficDelayTotal += route[i].trafficSec;
    });

    const totKm  = (roadRoute.totalDistM  / 1000).toFixed(1);
    const totMin = Math.round(roadRoute.totalTimeSec / 60);
    const delMin = Math.round(trafficDelayTotal / 60);

    if (useTraffic && delMin > 0) {
      toast(`✅ ${totKm} km · ${totMin} min com trânsito · 🚦 +${delMin} min congestionamento`, 'success');
    } else {
      toast(`✅ ${totKm} km por rua · ${totMin} min · ${engineName}`, 'success');
    }
    console.log(`[${engineName}] Rota OK: ${totKm} km, ${totMin} min, delay ${delMin} min`);

  } catch(e) {
    console.warn('[' + engineName + ' Route falhou]', e.message);
    // Mostra o erro real para facilitar diagnóstico
    toast('❌ ' + engineName + ': ' + e.message, 'error');
    geometry = null;
  }

  _setStepProgress(null);
  resetBtn();

  S.generatedRoute        = route;
  S.routeGeometry         = geometry;
  S.routeTrafficDelaySec  = trafficDelayTotal;
  goStep(4);
}

function _setStepProgress(msg) {
  let el = document.getElementById('step-progress');
  if (!msg) { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement('div');
    el.id = 'step-progress';
    el.style.cssText = [
      'position:fixed', 'bottom:80px', 'left:50%', 'transform:translateX(-50%)',
      'z-index:9990', 'background:rgba(9,17,31,.96)',
      'border:1px solid #1e3454', 'border-radius:10px',
      'padding:13px 22px', 'font-size:13px', 'color:#e2e8f0',
      'backdrop-filter:blur(10px)', 'display:flex', 'align-items:center',
      'gap:12px', 'box-shadow:0 8px 32px rgba(0,0,0,.6)',
      'white-space:nowrap',
    ].join(';');
    document.body.appendChild(el);
  }
  el.innerHTML = '<div class="spin" style="width:16px;height:16px;border-width:2px;flex-shrink:0"></div>' + msg;
}

async function saveRoute() {
  const route = S.generatedRoute;
  if (!route) return;
  // Distância e tempo reais por rua (OSRM/TomTom legs) ou estimativa linear
  const totalDist = route.reduce((s,r) => s + (r.distFromPrev || 0), 0);
  const hasRealTime = route.some(r => r.timeSec > 0);
  const hasTraffic  = route.some(r => r.trafficSec > 0);
  const totalTimeSec = hasRealTime
    ? route.reduce((s,r) => s + (r.timeSec || 0), 0)
    : (totalDist / 35) * 3600 + route.length * 180;
  const totalTime = totalTimeSec / 60;
  const trafficMin = Math.round((S.routeTrafficDelaySec || 0) / 60);
  const sourceLabel = hasTraffic
    ? '🚦 TomTom · +' + trafficMin + ' min trânsito'
    : hasRealTime ? '🛣️ OSRM · por rua real' : '📐 estimativa linear';
  const naive = Engine.naiveDist(S.stops);
  const savings = naive>0 ? Math.max(0,(1-totalDist/naive)*100) : 0;

  try {
    const result = await API.post('/api/routes', {
      name: S.routeConfig.name,
      mode: S.routeConfig.mode,
      totalDistanceKm: parseFloat(totalDist.toFixed(3)),
      estimatedTimeMin: parseFloat(totalTime.toFixed(1)),
      stopCount: route.length,
      savingsPct: parseFloat(savings.toFixed(2)),
      startLat: S.routeConfig.startLat,
      startLon: S.routeConfig.startLon,
      notes: '',
